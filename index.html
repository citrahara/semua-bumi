<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taman Kronik | Gardenscapes 3D dalam Buku</title>
  <meta name="description" content="Jelajahi taman bangsawan 3D ala Genshin, taklukkan puzzle Match-3 bertingkat ala Gardenscapes dengan ubin segel wawasan, dan renovasi 12 area taman dengan 3 pilihan gaya." />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="world-canvas" aria-label="Taman 3D Taman Kronik"></canvas>

  <!-- Minimalist Gardenscapes x Genshin 3D HUD -->
  <div id="hud-layer" class="hud-layer hidden">
    <!-- Top Left: Profile, Hearts, Stars, Coins & Next Renovation -->
    <div class="hud-top-left">
      <div class="garden-stat-bar">
        <button class="player-avatar-btn" id="btn-open-profile" type="button" title="Profil Pembaca">
          <div class="player-avatar-mini" id="hud-avatar"></div>
        </button>
        <div class="garden-res-group">
          <button class="res-pill hearts" id="btn-refill-heart" type="button" title="Nyawa (klik untuk isi lewat 1 soal kilat)">
            <span class="res-ico">♥</span>
            <span id="hud-lives">5/5</span>
          </button>
          <span class="res-pill stars" title="Bintang Renovasi Taman">
            <span class="res-ico">★</span>
            <span id="hud-stars">1</span>
          </span>
          <span class="res-pill coins" title="Koin Taman">
            <span id="hud-coins">120</span>
            <small>Koin</small>
          </span>
        </div>
      </div>

      <button class="quest-ribbon" id="btn-open-tasks" type="button" title="Buka daftar renovasi taman">
        <span class="quest-diamond" aria-hidden="true">★</span>
        <span class="quest-title" id="hud-next-task">Renovasi: Gerbang Utama</span>
        <span class="quest-dist" id="hud-task-progress">0/12</span>
      </button>
    </div>

    <!-- Top Right: Clean Minimal Actions -->
    <div class="hud-top-right">
      <div class="hud-icon-row">
        <button class="hud-btn" id="btn-open-study" type="button" title="Arsip Belajar: Korea, Sastra, Siber & Codex (C)">Arsip <span id="hud-codex-count">0/78</span></button>
        <button class="hud-btn" id="btn-toggle-sound" type="button" title="Suara">Suara</button>
        <button class="hud-btn help-circle" id="btn-toggle-help" type="button" title="Panduan Kontrol">?</button>
      </div>
      <div class="help-popover hidden" id="help-popover">
        <div><strong>Jalan 3D:</strong> WASD / Panah / Klik Tanah · <strong>Lari:</strong> Shift</div>
        <div><strong>POV:</strong> Tarik Kursor 360° / Scroll Zoom / [V] POV Bebas</div>
        <div><strong>Aksi:</strong> [E] Renovasi / Bicara · [P] Main Puzzle · [T] Tugas · [C] Arsip</div>
      </div>
    </div>

    <!-- Banner -->
    <div class="zone-banner" id="zone-banner" aria-live="polite">
      <div class="zone-banner-sub" id="zone-banner-sub">RENOVASI SELESAI</div>
      <div class="zone-banner-name" id="zone-banner-name">Gerbang Utama Taman</div>
    </div>

    <!-- Bottom Center: Contextual Interact Prompt -->
    <button class="interact-prompt hidden" id="btn-interact" type="button">
      <span class="key-cap">E</span>
      <span id="interact-label">Renovasi Gerbang Utama</span>
    </button>

    <!-- Bottom Right: Iconic Gardenscapes Play Level Button -->
    <div class="hud-bottom-right">
      <button class="play-level-btn" id="btn-play-level" type="button">
        <span class="play-diff-tag normal" id="play-diff-tag">Normal</span>
        <strong id="play-level-label">Main · Level 1</strong>
      </button>
    </div>

    <!-- Mobile Touch D-Pad -->
    <div class="touch-controls" id="touch-controls">
      <div class="dpad">
        <button class="dpad-btn up" data-dir="up" type="button" aria-label="Jalan ke atas">▲</button>
        <button class="dpad-btn left" data-dir="left" type="button" aria-label="Jalan ke kiri">◀</button>
        <button class="dpad-btn right" data-dir="right" type="button" aria-label="Jalan ke kanan">▶</button>
        <button class="dpad-btn down" data-dir="down" type="button" aria-label="Jalan ke bawah">▼</button>
      </div>
      <div class="touch-right-btns">
        <button class="touch-action-btn act" id="btn-touch-act" type="button">AKSI</button>
        <button class="touch-action-btn strike" id="btn-touch-play" type="button">MAIN</button>
      </div>
    </div>
  </div>

  <!-- Cover / Registration Overlay -->
  <div id="title-overlay" class="modal-backdrop">
    <div id="auth-card-root" class="title-card"></div>
  </div>

  <!-- Dynamic Modals (Match-3 Board, Renovation Picker, Tasks, Study Archive, Profile) -->
  <div id="overlay-root"></div>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
