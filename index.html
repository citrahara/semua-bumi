<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Atlas Bumi 3D</title>
  <meta name="description" content="Gim bola bumi 3D interaktif lintas film, buku, sejarah, sains, teknologi, dan seni bersama teman obrolan Ramyeon." />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="globe-canvas" aria-label="Bola Bumi 3D Interaktif Atlas Bumi"></canvas>

  <!-- Lapisan HUD Mengambang yang Ringan & Lega -->
  <div id="hud-layer" class="hud-layer hidden">
    <!-- Kiri Atas: Akun, Skor, Streak, Koleksi, Filter Bidang -->
    <div class="hud-top-left">
      <div class="stat-pill-bar">
        <button class="avatar-btn" id="btn-open-profile" type="button" title="Akun & Pengaturan">
          <span id="hud-initial">A</span>
        </button>
        <div class="stat-metric">
          <span class="stat-label">Skor</span>
          <strong id="hud-score">0</strong>
        </div>
        <div class="stat-divider"></div>
        <div class="stat-metric">
          <span class="stat-label">Streak</span>
          <strong id="hud-streak">0</strong>
        </div>
        <div class="stat-divider"></div>
        <button class="collection-pill" id="btn-open-collection" type="button" title="Lihat semua fakta yang sudah terbuka">
          <span class="collection-dot"></span>
          <span id="hud-collection">0/55</span>
        </button>
      </div>

      <div class="filter-bar">
        <label class="sr-only" for="category-select">Saring bidang pengetahuan</label>
        <select id="category-select" class="category-select" aria-label="Bidang pengetahuan"></select>
      </div>
    </div>

    <!-- Tengah Atas: Readout Negara & Koordinat Kursor -->
    <div class="globe-hover-pill" id="globe-hover-pill" aria-live="polite">
      Geser untuk memutar bumi · Gulir untuk memperbesar
    </div>

    <!-- Kanan Atas: Pilihan Mode, Suara, dan Ramyeon -->
    <div class="hud-top-right">
      <div class="mode-switcher" role="tablist" aria-label="Mode permainan">
        <button class="mode-tab active" data-mode="mix" type="button">Campur</button>
        <button class="mode-tab" data-mode="pin" type="button">Tancap Peta</button>
        <button class="mode-tab" data-mode="duel" type="button">Duel Tahun</button>
        <button class="mode-tab" data-mode="connect" type="button">Benang Merah</button>
      </div>
      <div class="utility-row">
        <button class="util-btn" id="btn-toggle-sound" type="button">Suara</button>
        <button class="util-btn ramyeon-btn" id="btn-toggle-ramyeon" type="button">
          <span class="ramyeon-dot"></span>
          <span>Ramyeon</span>
        </button>
      </div>
    </div>

    <!-- Tengah Bawah: Kartu Ronde Interaktif Ringkas -->
    <section class="round-dock" id="round-dock" aria-label="Ronde Aktif">
      <div class="round-card" id="round-card"></div>
    </section>

    <!-- Kanan: Laci Obrolan & Saran Ramyeon (100% Offline, Opsional) -->
    <aside class="ramyeon-drawer hidden" id="ramyeon-drawer" aria-label="Obrolan dengan Ramyeon">
      <div class="ramyeon-head">
        <div>
          <strong>Ramyeon</strong>
          <span class="ramyeon-sub">Teman saran dan obrolan</span>
        </div>
        <button class="icon-close-btn" id="btn-close-ramyeon" type="button" aria-label="Tutup Ramyeon">Tutup</button>
      </div>
      <div class="ramyeon-messages" id="ramyeon-messages"></div>
      <div class="ramyeon-chips" id="ramyeon-chips"></div>
      <form class="ramyeon-form" id="ramyeon-form">
        <input id="ramyeon-input" class="ramyeon-input" type="text" autocomplete="off" placeholder="Tanya saran film, buku, atau petunjuk..." />
        <button class="ramyeon-send" type="submit">Kirim</button>
      </form>
    </aside>
  </div>

  <!-- Notifikasi Singkat -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Overlay Pendaftaran 2 Langkah (Username + Tes Singkat 3 Soal) -->
  <div id="auth-overlay" class="modal-overlay hidden"></div>

  <!-- Modal Koleksi Penemuan / Profil -->
  <div id="modal-overlay" class="modal-overlay hidden"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
