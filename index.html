<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Meja Malam</title>
  <meta name="description" content="Ruang baca dan kedai teh malam hujan bersama rekan ngobrol AI, deduksi berkas, dan dekorasi 3D." />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="world-canvas" aria-label="Ruang Baca 3D Meja Malam"></canvas>

  <div id="hud-layer" class="hud-layer hidden">
    <!-- Top Left: Profil, Malam, Token Dekor -->
    <div class="hud-top-left">
      <div class="garden-stat-bar">
        <button class="player-avatar-btn" id="btn-open-profile" type="button" title="Profil & Ingatan">
          <span class="player-initial" id="hud-initial">M</span>
        </button>
        <div class="garden-res-group">
          <span class="res-pill night-pill" id="hud-night">Malam 1</span>
          <button class="res-pill stars" id="btn-open-decor-top" type="button" title="Dekor Ruang 3D">
            <span class="res-ico">★</span>
            <span id="hud-tokens">1</span>
            <small id="hud-decor-count">0/8</small>
          </button>
        </div>
      </div>

      <div class="tea-status-chip" id="hud-tea-chip" title="Teh di meja saat ini">
        <span class="tea-dot" id="hud-tea-dot"></span>
        <span id="hud-tea-name">Teh Melati Murni</span>
      </div>
    </div>

    <!-- Top Right: Rak Buku, Hujan, Suara, Koneksi AI -->
    <div class="hud-top-right">
      <div class="hud-icon-row">
        <button class="hud-btn" id="btn-open-books" type="button">Rak Buku</button>
        <button class="hud-btn" id="btn-toggle-rain" type="button">Hujan</button>
        <button class="hud-btn" id="btn-toggle-sound" type="button">Suara</button>
        <button class="hud-btn ai-status-btn" id="btn-open-ai" type="button">
          <span class="ai-dot" id="hud-ai-dot"></span>
          <span id="hud-ai-label">Koneksi AI</span>
        </button>
      </div>
    </div>

    <!-- Banner singkat -->
    <div class="zone-banner" id="zone-banner" aria-live="polite">
      <div class="zone-banner-sub" id="zone-banner-sub">MALAM 1</div>
      <div class="zone-banner-name" id="zone-banner-name">Meja Malam</div>
    </div>

    <!-- Bottom Left: Aksi Taktil Meja (Seduh Teh, Berkas Malam, Dekor 3D) -->
    <div class="salon-dock-left">
      <button class="salon-action-btn primary-case" id="btn-open-case" type="button">
        <strong id="case-btn-title">Berkas Malam 1</strong>
        <span id="case-btn-sub">Nadia · Draf Siaran Pers</span>
      </button>
      <div class="salon-action-row">
        <button class="salon-action-btn" id="btn-open-tea" type="button">
          <strong>Seduh Teh</strong>
          <span>Racik 3 bahan</span>
        </button>
        <button class="salon-action-btn" id="btn-open-decor" type="button">
          <strong>Dekor 3D</strong>
          <span id="decor-btn-sub">8 sudut ruang</span>
        </button>
      </div>
    </div>

    <!-- Right Side: Panel Obrolan Terbuka dengan Arka -->
    <aside class="arka-panel" id="arka-panel" aria-label="Obrolan dengan Arka">
      <div class="arka-head">
        <div>
          <strong>Arka</strong>
          <span class="arka-mode" id="arka-mode-tag">Mode Lokal</span>
        </div>
        <button class="arka-min-btn" id="btn-toggle-chat" type="button" title="Lipat obrolan">Tutup</button>
      </div>
      <div class="arka-messages" id="arka-messages"></div>
      <div class="arka-starters" id="arka-starters"></div>
      <form class="arka-form" id="arka-form">
        <input id="arka-input" class="arka-input" type="text" autocomplete="off" placeholder="Tulis apa saja ke Arka..." />
        <button class="arka-send" id="arka-send-btn" type="submit">Kirim</button>
      </form>
    </aside>

    <!-- Tombol buka ulang obrolan saat dilipat -->
    <button class="arka-reopen-btn hidden" id="btn-reopen-chat" type="button">Ngobrol dengan Arka</button>
  </div>

  <!-- Daftar Akun 2 Langkah (Username + 3 Soal Verifikasi) -->
  <div id="title-overlay" class="modal-backdrop">
    <div id="auth-card-root" class="title-card"></div>
  </div>

  <!-- Overlay Berkas Deduksi, Baki Teh, Rak Buku, Dekor 3D, Koneksi AI, Profil -->
  <div id="overlay-root"></div>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
