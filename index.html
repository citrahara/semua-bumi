<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Taman Kronik</title>
  <meta name="description" content="Puzzle Match-3 bertingkat dan renovasi taman 3D dalam buku." />
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <canvas id="world-canvas" aria-label="Taman 3D Taman Kronik"></canvas>

  <div id="hud-layer" class="hud-layer hidden">
    <!-- Top Left: Akun, Nyawa, Bintang, Koin, Tugas -->
    <div class="hud-top-left">
      <div class="garden-stat-bar">
        <button class="player-avatar-btn" id="btn-open-profile" type="button" title="Profil">
          <span class="player-initial" id="hud-initial">T</span>
        </button>
        <div class="garden-res-group">
          <button class="res-pill hearts" id="btn-refill-heart" type="button" title="Isi nyawa">
            <span class="res-ico">♥</span>
            <span id="hud-lives">5/5</span>
          </button>
          <span class="res-pill stars" title="Bintang renovasi">
            <span class="res-ico">★</span>
            <span id="hud-stars">1</span>
          </span>
          <span class="res-pill coins" title="Koin">
            <span id="hud-coins">120</span>
            <small>Koin</small>
          </span>
        </div>
      </div>

      <button class="quest-ribbon" id="btn-open-tasks" type="button" title="Daftar renovasi (T)">
        <span class="quest-diamond" aria-hidden="true">★</span>
        <span class="quest-title" id="hud-next-task">Gerbang Utama · 1 ★</span>
        <span class="quest-dist" id="hud-task-progress">0/12</span>
      </button>
    </div>

    <!-- Top Right: Arsip, Suara, Kontrol -->
    <div class="hud-top-right">
      <div class="hud-icon-row">
        <button class="hud-btn" id="btn-open-study" type="button" title="Arsip (C)">Arsip <span id="hud-codex-count">0/78</span></button>
        <button class="hud-btn" id="btn-toggle-sound" type="button">Suara</button>
        <button class="hud-btn help-circle" id="btn-toggle-help" type="button" title="Kontrol">?</button>
      </div>
      <div class="help-popover hidden" id="help-popover">
        <div><strong>Gerak:</strong> WASD / klik tanah · <strong>Lari:</strong> Shift</div>
        <div><strong>Kamera:</strong> seret kursor / scroll zoom / [V] POV bebas</div>
        <div><strong>Pintasan:</strong> [E] Renovasi · [P] Puzzle · [T] Area · [C] Arsip</div>
      </div>
    </div>

    <!-- Banner singkat -->
    <div class="zone-banner" id="zone-banner" aria-live="polite">
      <div class="zone-banner-sub" id="zone-banner-sub">RENOVASI</div>
      <div class="zone-banner-name" id="zone-banner-name">Gerbang Utama</div>
    </div>

    <!-- Bottom Left: Peta Taman & Area Terkunci -->
    <div class="estate-minimap" id="estate-minimap">
      <div class="mm-head">
        <span>Peta Taman</span>
        <strong id="mm-progress">0/12</strong>
      </div>
      <div class="mm-canvas" id="mm-canvas">
        <svg class="mm-bg" viewBox="0 0 140 110" aria-hidden="true">
          <rect x="4" y="4" width="132" height="102" rx="8" fill="#233022" stroke="#6B5C47" stroke-width="1.5" />
          <path d="M70 100 L70 14 M22 56 L118 56" stroke="#8C7E68" stroke-width="4" stroke-linecap="round" opacity="0.5" />
          <circle cx="70" cy="56" r="10" fill="#2D4A52" opacity="0.7" />
          <ellipse cx="31" cy="74" rx="14" ry="9" fill="#2D4A52" opacity="0.75" />
        </svg>
        <div class="mm-pins" id="mm-pins"></div>
        <div class="mm-player" id="mm-player" title="Posisi kamu"></div>
      </div>
      <div class="mm-legend">
        <span><i class="lg-dot me"></i>Kamu</span>
        <span><i class="lg-dot ready"></i>Siap</span>
        <span><i class="lg-dot locked"></i>Kunci</span>
        <span><i class="lg-dot open"></i>Buka</span>
      </div>
    </div>

    <!-- Bottom Center: Interaksi Kontekstual -->
    <button class="interact-prompt hidden" id="btn-interact" type="button">
      <span class="key-cap">E</span>
      <span id="interact-label">Gerbang Utama</span>
    </button>

    <!-- Bottom Right: Tombol Main Puzzle -->
    <div class="hud-bottom-right">
      <button class="play-level-btn" id="btn-play-level" type="button">
        <span class="play-diff-tag normal" id="play-diff-tag">Normal · +1 ★</span>
        <strong id="play-level-label">Main · Level 1</strong>
      </button>
    </div>

    <!-- Kontrol Sentuh Mobile -->
    <div class="touch-controls" id="touch-controls">
      <div class="dpad">
        <button class="dpad-btn up" data-dir="up" type="button" aria-label="Atas">▲</button>
        <button class="dpad-btn left" data-dir="left" type="button" aria-label="Kiri">◀</button>
        <button class="dpad-btn right" data-dir="right" type="button" aria-label="Kanan">▶</button>
        <button class="dpad-btn down" data-dir="down" type="button" aria-label="Bawah">▼</button>
      </div>
      <div class="touch-right-btns">
        <button class="touch-action-btn act" id="btn-touch-act" type="button">AKSI</button>
        <button class="touch-action-btn strike" id="btn-touch-play" type="button">MAIN</button>
      </div>
    </div>
  </div>

  <!-- Layar Daftar / Masuk Akun (Tanpa Pilih Karakter) -->
  <div id="title-overlay" class="modal-backdrop">
    <div id="auth-card-root" class="title-card"></div>
  </div>

  <!-- Overlay Puzzle, Pratinjau Renovasi 3D, Daftar Area, Arsip, Profil -->
  <div id="overlay-root"></div>

  <div id="toast" class="toast" role="status" aria-live="assertive"></div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
